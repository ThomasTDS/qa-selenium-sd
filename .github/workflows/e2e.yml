name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Roda a suíte todo dia, mesmo sem commits, para detectar quando o site alvo
  # muda e quebra algum fluxo. 09:17 UTC = 06:17 em Brasília; o minuto quebrado
  # evita a virada da hora, quando a fila de agendamentos do GitHub atrasa.
  schedule:
    - cron: '17 9 * * *'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Edge foi removido da matrix por instabilidade recorrente e imprevisível
        # nesse runner (ver Issue de bug report). Continua suportado localmente
        # via BROWSER=edge.
        browser: [chrome]
    env:
      BROWSER: ${{ matrix.browser }}
      HEADLESS: 'true'
      BASE_URL: https://automationexercise.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm test

      # Lista os cenários que só passaram depois do retry no resumo do job.
      - name: Report flaky scenarios
        if: always()
        run: npm run report:flaky

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: reports/
          retention-days: 7

  docker:
    # Roda depois do e2e (não em paralelo) para não dobrar a carga simultânea
    # sobre o site alvo — ver bug de bot-detection do Cloudflare na Issue #15.
    needs: e2e
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t qa-selenium-sd .

      - name: Run suite inside the container
        run: docker run --rm qa-selenium-sd

  publish-report:
    needs: e2e
    if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download test report
        uses: actions/download-artifact@v8
        with:
          name: cucumber-report-chrome
          path: reports

      - name: Prepare Pages content
        run: cp reports/cucumber-report.html reports/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
